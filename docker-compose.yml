# Optional helpers for the CodeGraph workspace. The API and the pipeline agents
# deliberately stay on the host: they need your git/gh credentials, your
# toolchains, and they edit the real work repos (see SETUP.md, "Docker").
#
# Reads NEO4J_PASSWORD (and optionally TB_REPOS_DIR, NEO4J_*_PORT) from the API
# settings file, so pass it explicitly:
#
#   docker compose --env-file codegraph/api/.env up -d neo4j
#   docker compose --env-file codegraph/api/.env run --rm graphify
name: code-graph

services:
  # Local graph database. Data persists in the `neo4j_data` volume.
  # NEO4J_AUTH only takes effect the first time the volume is created; to change
  # the password later, run `docker compose down -v` (this deletes the graph).
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in codegraph/api/.env (8+ characters)}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-off graph build: extracts the work repos (mounted read-only) and pushes
  # the result to the neo4j service above. Does NOT touch git in the repos.
  graphify:
    profiles: ["graph"]
    build: ./graphify
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in codegraph/api/.env}
      CODEGRAPH_SKIP_DIRS: ${CODEGRAPH_SKIP_DIRS:-}
      GRAPHIFY_CACHE_DIR: /cache
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - graphify_cache:/cache
      - ./graphify:/app:ro
      - ./codegraph/api/repos.local.json:/config/repos.json:ro
      # Repos cloned into this folder are found via /workspace; repos that are
      # symlinks to another folder (TB_REPOS_DIR, e.g. ~/Desktop/code) via /repos.
      - .:/workspace:ro
      - ${TB_REPOS_DIR:-.}:/repos:ro

volumes:
  neo4j_data:
  graphify_cache:
