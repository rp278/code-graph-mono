<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Structured connections</title>
    <style>
      html, body { margin: 0; background: #0a0e14; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { padding: 40px 48px 64px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #8b94a3; margin: 0 0 28px; font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 18px; max-width: 980px; }
      .card { background: #11161f; border: 1px solid #1e2633; border-radius: 16px; padding: 22px; }
      .preview { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
      img { width: 96px; height: 96px; border-radius: 50%; }
      .kicker { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #22d3ee; letter-spacing: 0.08em; }
      h2 { margin: 2px 0 0; font-size: 15px; }
      .blurb { margin: 0; font-size: 13px; color: #8b94a3; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>Structured connections</h1>
    <p>Right-angle edges, even spacing. Ends still sit on G. 1 is live on the landing page.</p>
    <div class="grid">
      <article class="card">
        <div class="preview">
          <img src="/logo-st1-circuit.svg" alt="1" />
          <div><div class="kicker">1</div><h2>Circuit</h2></div>
        </div>
        <p class="blurb">Orthogonal rails around CG. Schematic, ordered.</p>
      </article>
      <article class="card">
        <div class="preview">
          <img src="/logo-st2-lattice.svg" alt="2" />
          <div><div class="kicker">2</div><h2>Lattice</h2></div>
        </div>
        <p class="blurb">A regular grid on the left, two elbows onto G.</p>
      </article>
      <article class="card">
        <div class="preview">
          <img src="/logo-st3-hierarchy.svg" alt="3" />
          <div><div class="kicker">3</div><h2>Hierarchy</h2></div>
        </div>
        <p class="blurb">A branching tree with square corners.</p>
      </article>
    </div>
  </body>
</html>
